org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off, and it has to be on this machine.
#
# The project lives on D: while the Pub cache lives on C:. Kotlin's incremental
# compiler stores *relative* paths in its caches, and relativising a path across
# two drive letters throws:
#
#   IllegalArgumentException: this and base files have different roots:
#   C:\Users\...\Pub\Cache\hosted\pub.dev\android_file_picker-2.0.1\... and
#   D:\Users\...\darkflow\android
#
# That aborts `compileDebugKotlin` for every plugin, so the build never gets
# past a quarter of the way. Turning the incremental caches off costs a slower
# rebuild and removes the failure entirely. The in-process strategy keeps the
# Kotlin daemon — which is what owns those caches — out of the picture too.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
